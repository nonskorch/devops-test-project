server {
    # Nginx принимает запросы на порту 80 внутри контейнера
    listen 80;

    location / {
        # Передаём всё приложению. app — имя сервиса из docker-compose,
        # Docker сам превратит его в нужный IP. 3000 — порт приложения
        proxy_pass http://app:3000;

        # Передаём приложению информацию об исходном запросе,
        # иначе оно будет думать, что все запросы идут от nginx
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
